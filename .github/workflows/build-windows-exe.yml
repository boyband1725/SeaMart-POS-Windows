name: Build SeaMart POS V15 Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SeaMart_POS_V15_Paket_Build_Installer_Fix1.zip'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SeaMart source package
        shell: pwsh
        run: |
          $archive = 'SeaMart_POS_V15_Paket_Build_Installer_Fix1.zip'
          if (!(Test-Path $archive)) { throw "File paket belum diunggah: $archive" }
          Expand-Archive -LiteralPath $archive -DestinationPath source -Force
          if (!(Test-Path 'source/seamart.py')) { throw 'seamart.py tidak ditemukan di dalam ZIP' }
          if (!(Test-Path 'source/requirements.txt')) { throw 'requirements.txt tidak ditemukan di dalam ZIP' }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt

      - name: Run database tests (diagnostic; does not block packaging)
        working-directory: source
        continue-on-error: true
        run: python -m unittest -v test_seamart_db.py

      - name: Check Python syntax
        working-directory: source
        run: python -m py_compile seamart.py

      - name: Build EXE
        working-directory: source
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SeaMartPOSV15 seamart.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path 'source/dist/SeaMartPOSV15.exe')) { throw 'SeaMartPOSV15.exe tidak ditemukan' }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SeaMartPOSV15-Windows-EXE
          path: source/dist/SeaMartPOSV15.exe
          if-no-files-found: error
